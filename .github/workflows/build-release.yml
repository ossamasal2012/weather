name: Build and Release APK

# Runs automatically on every push to main/master (exactly the "commit ->
# automatic build" flow described in the project's update-system brief), and
# can also be triggered manually from the Actions tab.
"on":
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode signing keystore (if the 4 secrets are configured)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "${{ runner.temp }}/release.keystore"
            echo "Keystore decoded — the APK will be signed with your release key."
          else
            echo "::warning::KEYSTORE_BASE64 secret is not set — the APK will fall back to DEBUG signing. See README.md > 'إعداد التوقيع' to configure the 4 required secrets."
          fi

      - name: Build signed release APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Read versionCode / versionName from app/build.gradle.kts
        id: version
        run: |
          CODE=$(grep -oP '(?<=versionCode = )[0-9]+' app/build.gradle.kts | head -n1)
          NAME=$(grep -oP '(?<=versionName = ")[^"]+' app/build.gradle.kts | head -n1)
          if [ -z "$CODE" ] || [ -z "$NAME" ]; then
            echo "::error::Could not read versionCode/versionName from app/build.gradle.kts"
            exit 1
          fi
          echo "Detected versionCode=$CODE versionName=$NAME"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Stage release artifacts
        run: |
          mkdir -p release-assets
          cp app/build/outputs/apk/release/app-release.apk release-assets/app-release.apk

          cat > release-assets/version.json << EOF
          {
            "version_code": ${{ steps.version.outputs.code }},
            "version_name": "${{ steps.version.outputs.name }}",
            "apk_url": "https://github.com/${{ github.repository }}/releases/download/latest/app-release.apk",
            "force_update": true,
            "release_notes": "إصدار جديد من تطبيق الطقس.",
            "published_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          cat release-assets/version.json

      - name: Publish "latest" release (replaces the previous one automatically)
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: latest
          name: "أحدث إصدار — v${{ steps.version.outputs.name }} (${{ steps.version.outputs.code }})"
          body: |
            تحديث تلقائي منشور بواسطة GitHub Actions.
            هذا الإصدار يستبدل تلقائياً أي إصدار سابق بنفس الوسم `latest`،
            لذلك رابط التحديث داخل التطبيق يبقى ثابتاً دائماً.
          files: |
            release-assets/app-release.apk
            release-assets/version.json
          prerelease: false
          make_latest: true
