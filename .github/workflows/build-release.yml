name: Build and Release APK

# Runs automatically on every push to main/master
# and can also be triggered manually from the Actions tab.

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      # ─────────────────────────────────────────────
      # Checkout
      # ─────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ─────────────────────────────────────────────
      # Java 17
      # ─────────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # ─────────────────────────────────────────────
      # Android SDK
      # ─────────────────────────────────────────────
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # ─────────────────────────────────────────────
      # Gradle permissions
      # ─────────────────────────────────────────────
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # ─────────────────────────────────────────────
      # Check signing secret
      # ─────────────────────────────────────────────
      - name: Check release-signing secret
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::KEYSTORE_BASE64 secret is not set."
            echo "::warning::The build will use the project's default signing configuration."
          else
            echo "KEYSTORE_BASE64 secret is available."
          fi

      # ─────────────────────────────────────────────
      # Decode release keystore
      # ─────────────────────────────────────────────
      - name: Decode signing keystore
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "${{ runner.temp }}/release.keystore"

          if [ ! -s "${{ runner.temp }}/release.keystore" ]; then
            echo "::error::Failed to create release.keystore"
            exit 1
          fi

          echo "Release keystore decoded successfully."

      # ─────────────────────────────────────────────
      # Build Release APK
      # ─────────────────────────────────────────────
      - name: Build release APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease --no-daemon --stacktrace

      # ─────────────────────────────────────────────
      # Verify APK
      # ─────────────────────────────────────────────
      - name: Verify release APK
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "::error::Release APK was not generated."
            exit 1
          fi

          echo "APK successfully generated:"
          ls -lh "$APK"

      # ─────────────────────────────────────────────
      # Read version information
      # ─────────────────────────────────────────────
      - name: Read versionCode / versionName from app/build.gradle.kts
        id: version
        run: |
          CODE=$(grep -oP '(?<=versionCode = )[0-9]+' app/build.gradle.kts | head -n1)
          NAME=$(grep -oP '(?<=versionName = ")[^"]+' app/build.gradle.kts | head -n1)

          if [ -z "$CODE" ] || [ -z "$NAME" ]; then
            echo "::error::Could not read versionCode/versionName from app/build.gradle.kts"
            exit 1
          fi

          echo "Detected versionCode=$CODE"
          echo "Detected versionName=$NAME"

          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      # ─────────────────────────────────────────────
      # Prepare release assets
      # ─────────────────────────────────────────────
      - name: Stage release artifacts
        run: |
          mkdir -p release-assets

          cp app/build/outputs/apk/release/app-release.apk \
            release-assets/app-release.apk

          cat > release-assets/version.json << EOF
          {
            "version_code": ${{ steps.version.outputs.code }},
            "version_name": "${{ steps.version.outputs.name }}",
            "apk_url": "https://github.com/${{ github.repository }}/releases/download/latest/app-release.apk",
            "force_update": true,
            "release_notes": "إصدار جديد من تطبيق الطقس.",
            "published_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF

          echo "Generated version.json:"
          cat release-assets/version.json

      # ─────────────────────────────────────────────
      # Delete old latest release/tag if necessary
      # ─────────────────────────────────────────────
      - name: Publish latest release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: latest
          name: "أحدث إصدار — v${{ steps.version.outputs.name }} (${{ steps.version.outputs.code }})"
          body: |
            تحديث تلقائي منشور بواسطة GitHub Actions.

            هذا الإصدار يستبدل الإصدار السابق بنفس الوسم:
            latest

            لذلك يبقى رابط التحديث داخل التطبيق ثابتاً دائماً.
          files: |
            release-assets/app-release.apk
            release-assets/version.json
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
