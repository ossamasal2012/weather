# Project-wide Gradle settings.

# JVM heap size for the Gradle daemon. Increased for smoother CI/local builds.
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8 -XX:+UseParallelGC

# Run tasks in parallel and cache build outputs for faster incremental builds.
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true

# AndroidX is required — the project uses only AndroidX/Jetpack libraries.
android.useAndroidX=true

# Kotlin code style.
kotlin.code.style=official

# Disable build feature flags we don't use, to keep builds lean.
android.defaults.buildfeatures.buildconfig=true
android.nonTransitiveRClass=true
android.nonFinalResIds=false
